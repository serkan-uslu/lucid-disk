[project]
name = "luciddisk-mcp"
version = "0.2.0"
description = "Read-only macOS disk cleanup assessment tools for Lucid Disk"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
]

[project.scripts]
luciddisk-mcp = "luciddisk_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luciddisk_mcp"]
