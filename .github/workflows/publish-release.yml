# Publishes an accepted release candidate without rebuilding it: tags the candidate's
# exact source commit and creates a DRAFT GitHub Release with the same bytes.
# After checking the draft, publish it with:
#   gh release edit vX.Y.Z --draft=false --prerelease=false --latest
name: Publish release draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, e.g. 1.0.0
        required: true
        type: string
      candidate_run_id:
        description: Run ID of the successful "Signed release candidate" workflow
        required: true
        type: string

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ inputs.version }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Check candidate and tag its source commit
        run: |
          set -euo pipefail
          (cd candidate && sha256sum -c SHA256SUMS.txt)
          SHA="$(jq -r .sourceCommit candidate/release-evidence.json)"
          test "$(jq -r .version candidate/release-evidence.json)" = "$VERSION"
          test "$(jq -r .distribution.notarizationStatus candidate/release-evidence.json)" = "Accepted"
          test "$(jq -r .distribution.staplerValidated candidate/release-evidence.json)" = "true"
          test "$(jq -r .distribution.appNotarizationStatus candidate/release-evidence.json)" = "Accepted"
          test "$(jq -r .distribution.appStaplerValidated candidate/release-evidence.json)" = "true"
          git merge-base --is-ancestor "$SHA" origin/main
          # Re-runnable: an existing tag is reused only if it already names this commit.
          # Tags never move; a mismatch stops here.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            git fetch -q origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            test "$(git rev-list -n 1 "v$VERSION")" = "$SHA" || { echo "v$VERSION exists on another commit" >&2; exit 1; }
          else
            git tag -a "v$VERSION" "$SHA" -m "Lucid Disk $VERSION"
            git push origin "v$VERSION"
          fi

      - name: Create draft release
        run: |
          set -euo pipefail
          files=(candidate/LucidDisk.dmg candidate/SHA256SUMS.txt candidate/notarization.json candidate/app-notarization.json candidate/release-evidence.json)
          for log in candidate/notarization-log.json candidate/app-notarization-log.json; do
            if [ -f "$log" ]; then files+=("$log"); fi
          done
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # Only an unpublished draft may be completed; a published release is never changed.
            test "$(gh release view "v$VERSION" --json isDraft -q .isDraft)" = "true" \
              || { echo "v$VERSION is already published" >&2; exit 1; }
            gh release upload "v$VERSION" "${files[@]}" --clobber
          else
            gh release create "v$VERSION" "${files[@]}" --verify-tag --draft \
              --title "Lucid Disk $VERSION" --generate-notes
          fi
