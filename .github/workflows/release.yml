name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A version tag also marks a LucidDiskCore release for other editions to pin.
  # Until Developer ID secrets exist, tags must not produce a failed release run.
  signing-ready:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Developer ID secrets are not configured; skipping the signed DMG."
          fi

  signed-dmg:
    needs: signing-ready
    if: needs.signing-ready.outputs.ready == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test before signing
        run: swift test

      - uses: astral-sh/setup-uv@v6

      - name: Test MCP server
        run: uv run --project mcp --with pytest pytest mcp/tests

      - name: Import signing identity
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/lucid-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Configure notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials lucid-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$RUNNER_TEMP/lucid-signing.keychain-db"

      - name: Build, sign, notarize, and staple
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARYTOOL_PROFILE: lucid-notary
        run: |
          ./build_dmg.sh
          codesign --verify --deep --strict --verbose=2 "build/Lucid Disk.app"
          xcrun stapler validate "build/Lucid Disk.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "build/Lucid Disk.dmg"

      # A stable asset name keeps https://github.com/<repo>/releases/latest/download/LucidDisk.dmg working.
      - name: Prepare release assets
        run: |
          cp "build/Lucid Disk.dmg" build/LucidDisk.dmg
          (cd build && shasum -a 256 LucidDisk.dmg > LucidDisk.dmg.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: lucid-disk-dmg
          path: |
            build/LucidDisk.dmg
            build/LucidDisk.dmg.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/LucidDisk.dmg build/LucidDisk.dmg.sha256 --generate-notes

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/lucid-signing.keychain-db" || true
