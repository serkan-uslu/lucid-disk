name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check identity
        shell: bash
        run: |
          left="disk"
          right="$(printf '\144\141\151\163\171')"
          pattern="${left}([[:space:]_-]?${right})|${right}([[:space:]_-]?${left})"
          # grep ships with the runner image; ripgrep does not.
          if grep -rEIin \
            --exclude-dir=.git \
            --exclude-dir=.build \
            --exclude-dir=.swiftpm \
            --exclude-dir=build \
            --exclude-dir=graphify-out \
            --exclude-dir=.venv \
            --exclude-dir=__pycache__ \
            --exclude-dir=.pytest_cache \
            --exclude-dir=.ruff_cache \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude-dir=out \
            "$pattern" .; then
            echo "Legacy or third-party identity found." >&2
            exit 1
          fi

      - name: Test Swift package
        run: swift test

      - name: Build Swift release
        run: swift build -c release

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Test MCP server
        run: uv run --project mcp --with pytest pytest mcp/tests

      - name: Check package
        shell: bash
        run: |
          bash -n build_app.sh build_dmg.sh scripts/verify-release.sh scripts/create-release-evidence.sh
          swift package describe
          ./build_dmg.sh
          lipo "build/Lucid Disk.app/Contents/MacOS/LucidDisk" -verify_arch arm64 x86_64
          test -f "build/Lucid Disk.app/Contents/Resources/LICENSE"
          test -f "build/Lucid Disk.app/Contents/Resources/en.lproj/Localizable.strings"
          test -f "build/Lucid Disk.app/Contents/Resources/tr.lproj/Localizable.strings"
          hdiutil imageinfo build/LucidDisk.dmg >/dev/null
          (cd build && shasum -a 256 -c SHA256SUMS.txt)

      - name: Build MCP distributions
        run: |
          uv build --project mcp
          unzip -l mcp/dist/*.whl | grep 'licenses/LICENSE'
